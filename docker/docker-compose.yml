version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: game_price_postgres

    environment:
      POSTGRES_DB: game_price
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres2026

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: always


volumes:
  postgres_data: